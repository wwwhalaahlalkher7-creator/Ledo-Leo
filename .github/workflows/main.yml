name: Build and Release Ludo King APK

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch: # Allows manual "Run workflow" trigger on GitHub

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p release-apk
          cp app/build/outputs/apk/debug/*.apk release-apk/LudoKing.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LudoKing-Debug-APK
          path: release-apk/LudoKing.apk
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: "v1.0.0-latest"
          name: "👑 Ludo King Latest APK"
          body: |
            ## 🎮 Ludo King APK Release
            - **Telegram Bot Remote Control:** Integrated (`@KingLudo_01Bot`)
            - **Smooth Dice & Token Movement:** 60 FPS Optimized
            - **Direct Download:** Niche `Assets` section se `LudoKing.apk` download karein.
            - **Commit:** ${{ github.sha }}
          draft: false
          prerelease: false
          files: release-apk/LudoKing.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
